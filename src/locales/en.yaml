kb:
  save: 💾 Remember
  settings: ⚙️ Settings
  undo: ⚠️ Undo
  start: 🆕 Start over
  placeholder: 'Tell me something…'
  activated: '✨ Ready. Commands are below 👇'
  confirm_save: |-
    💾 I'll remember our whole chat and put it in memory — so I can come back to it later.

    Changed your mind? Tap <b>⚠️ Undo</b> and I'll remove the latest save.

    Save it?
  confirm_undo: |-
    ⚠️ I'll erase what I <b>recently</b> remembered.

    Older memories and your profile stay safe — only the latest save is removed.

    Undo it?
