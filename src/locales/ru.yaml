# Russian (ru) — donor language, source of truth
# Keys are dot-paths. Values may use {{ var }} for jinja2 interpolation.

start:
  already_onboarded: |-
    жив. Если хочешь начать онбординг с нуля — сначала удали
    <code>_meta/portrait.md</code> и <code>_meta/owner.md</code> в Obsidian,
    потом снова /start.
  pick_ui_language: |-
    👋 Привет! Я твой персональный AI с долгосрочной памятью.

    <b>На каком языке будем общаться?</b>

    Choose your interface language / Suhbat tilini tanlang:
  ui_language_set: |-
    Ок, говорим по-русски. Теперь — <b>как ты хочешь меня называть?</b>
    Например: Макс, Ася, Мнемо — или просто Ассистент.

onboarding:
  ask_personality: |-
    Буду <b>{{ bot_name }}</b>! Теперь выбери <b>стиль общения</b>:

    1 — Дружелюбный и тёплый
    2 — Строгий и по делу
    3 — Немного саркастичный
    4 — Как ментор (задаёт вопросы, направляет)
    5 — Свой стиль (просто напиши)
  ask_owner_name: |-
    Понял! Теперь — <b>как тебя зовут?</b>

    Имя или ник — чтобы я к тебе обращался правильно.
  ask_notes_language: |-
    Отлично, <b>{{ owner_name }}</b>! Ещё один вопрос — <b>на каком языке вести твои заметки</b>?

    🇷🇺 <b>Русский</b> — заметки на русском
    🇬🇧 <b>English</b> — notes in English
    🇺🇿 <b>O'zbekcha</b> — yozuvlar o'zbekcha

    Это важно: чтобы граф не превратился в кашу из разных языков.
  ask_portrait: |-
    Окей, язык записей: <b>{{ lang_label }}</b>. И последнее — <b>расскажи о себе</b>:

    Кто ты, чем занимаешься, какие проекты и люди важны,
    интересы, ценности, цели. Чем подробнее — тем умнее буду с первого дня.
  forced_end: |-
    Заверши то что начал — детали можем уточнить позже в обычном диалоге.
  loop_force_end: |-
    Окей, я заметил что хожу по кругу — давай начнём общаться, а детали
    добавишь по ходу. Я всё запомню.

personality:
  friendly: Дружелюбный и тёплый — поддерживающий, позитивный, создаёт комфорт в диалоге
  direct: Строгий и по делу — минимум лирики, только факты и действия
  sarcastic: Немного саркастичный — остроумный, иногда подкалывает, но всегда по существу
  mentor: Как ментор — задаёт вопросы, помогает думать самостоятельно, не даёт готовых ответов

save:
  no_active_session: нет активной сессии
  empty_session: сессия пустая, нечего запоминать
  processing: '✨ запоминаю...'
  shifting: 'тема поменялась — запоминаю предыдущий разговор...'
  failed: '⚠ не смог разобрать разговор: {{ error }}'
  empty_result: пустой разговор, ничего нового
  compressing: '💭 разговор длинный, концентрирую главное...'

pipeline:
  extract_failed: 'не смог разобрать разговор: {{ error }}'
  apply_failed: 'не смог сохранить в память: {{ error }}'
  summary: |-
    Запомнил: {{ count }}
    Тема: {{ topic }}
    Итог: {{ summary }}{{ open_q }}
  open_questions_block: |2-

    Открытые вопросы:
    {{ items }}

undo:
  refuse_onboarding: |-
    ⛔ последний коммит затрагивает onboarding-файлы (owner/portrait).
    Я не буду их откатывать автоматически. Если действительно нужно —
    разрули вручную через git.

lang:
  current: |-
    Текущий язык интерфейса: <b>{{ ui }}</b>
    Текущий язык заметок: <b>{{ notes }}</b>

    Что меняем?
  pick_ui: 'Выбери язык интерфейса:'
  pick_notes: 'Выбери язык заметок:'
  ui_updated: 'Язык интерфейса: <b>{{ name }}</b>.'
  notes_updated: 'Язык заметок: <b>{{ name }}</b>. Новые заметки будут на этом языке.'
  cancelled: отменено
  unknown_action: не понял что менять

multimodal:
  transcribing: '🎙️ обрабатываю...'
  no_speech: не смог распознать речь
  analyzing_image: '👀 смотрю...'
  image_failed: 'не смог обработать изображение: {{ error }}'

confirm:
  confirmed: Подтверждено
  cancelled: Отменено
  delete_note: 'Удалить заметку {{ path }}?'
  delete_cancelled: удаление отменено
  button_yes: Подтвердить
  button_no: Отмена

scheduler:
  conflict_alert: |-
    ⚠️ Конфликт при git pull в vault. Разруливай вручную в репо.
    До разрешения синхронизация остановлена.
  no_session_log: нет записей о прошлых сессиях

language_label:
  ru: русский
  en: English
  uz: O'zbekcha

cmd_descriptions:
  start: Начать или возобновить
  save: Сохранить текущую сессию
  undo: Откатить последний коммит
  lang: Сменить язык интерфейса или заметок

errors:
  tool_error: 'ошибка инструмента {{ name }}: {{ error }}'

ui_buttons:
  ui_language: Язык интерфейса
  notes_language: Язык заметок
  cancel: Отмена

section_headers:
  facts: Факты
  links: Связи
