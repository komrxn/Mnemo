  menu: |-
    ⚙️ <b>Sozlamalar</b>

    🤖 Ism: <b>{{ name }}</b>
    🎭 Uslub: {{ personality }}
    💬 Suhbat tili: <b>{{ ui_lang }}</b>
    📓 Yozuvlar tili: <b>{{ notes_lang }}</b>
  btn_name: 🤖 Ism
  btn_personality: 🎭 Uslub
  btn_languages: 🌐 Tillar
  btn_close: ❌ Yopish
  btn_back: ↩️ Orqaga
  closed: sozlamalar yopildi

  name_view: |-
    🤖 <b>Bot ismi</b>

    Hozir: <b>{{ name }}</b>

    Yangi ismni bitta xabarda yubor (1-30 belgi).
  name_too_short: 'ism bo''sh bo''la olmaydi — qaytadan yubor'
  name_too_long: 'juda uzun — 30 belgigacha'
  name_saved: '✓ Endi meni <b>{{ name }}</b> deb chaqirishadi.'

  personality_view: |-
    🎭 <b>Muloqot uslubi</b>

    Hozir: {{ current }}

    Tayyor variantni tanla yoki sozla:
  personality_custom_view: |-
    ✍️ <b>O''z uslubim</b>

    Hozir: {{ current }}

    Qanday gaplashishimni yoz. Bir gap bilan yoki
    4 ta savolga javob ber — qaysi qulay:

    1. Ohang — rasmiy / do'stona / aka-uka kabi / qat'iy?
    2. Uzunlik — qisqa va aniq / batafsil misollar bilan?
    3. Hazil qilsam, bahslashsam bo'ladimi?
    4. Nima g'ashga tegadi — nima qilmayman?

    Bitta xabarda erkin yoz.
  personality_synth_preview: |-
    🧠 Mana nimani tushundim:

    "{{ synthesized }}"

    Yangi uslub sifatida saqlaylikmi?
  personality_synth_failed: |-
    ⚠️ Chiroyli shakllantirolmadim — yozganingni saqlayman.

    "{{ raw }}"

    Saqlaylikmi?
  add_rule_view: |-
    ➕ <b>Qoida qo'shish</b>

    Hozir: {{ current }}

    Uslubimga qo'shadigan bitta qoidani yoz. Masalan:
    • "smaylik ishlatma"
    • "menga 'aka' deb murojaat qil"
    • "men aytganni qaytarma"

    Bu mavjud uslubga <b>qo'shiladi</b>, almashtirmaydi.
  add_rule_preview: |-
    ➕ Qo'shaman:

    "{{ rule }}"

    Yangi uslub:

    "{{ updated }}"

    Saqlaylikmi?
  add_rule_failed: |-
    ⚠️ Chiroyli shakllantirolmadim — bor holicha qo'shaman.

    Saqlaylikmi?
  btn_personality_friendly: 😊 Do'stona
  btn_personality_direct: 🎯 Qat'iy
  btn_personality_sarcastic: 😏 Hazilkash
  btn_personality_mentor: 🧑‍🏫 Murabbiy
  btn_personality_custom: ✍️ O'z uslubim
  btn_personality_add_rule: ➕ Qoida qo'shish
