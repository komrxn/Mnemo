services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data/vault:/data/vault
      - ./data/lightrag:/data/lightrag
      - ./secrets/vault_ssh_key:/run/secrets/vault_ssh_key:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c 'import sys, redis; r = redis.from_url(\"redis://redis:6379/0\"); sys.exit(0 if r.ping() else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  lightrag-api:
    build:
      context: .
      dockerfile: Dockerfile.lightrag
    env_file: .env
    environment:
      MAX_PARALLEL_INSERT: "1"
      LLM_BINDING: openai
      LLM_BINDING_HOST: https://api.openai.com/v1
      LLM_MODEL: gpt-5.4
      LLM_BINDING_API_KEY: ${OPENAI_API_KEY}
      EMBEDDING_BINDING: openai
      EMBEDDING_BINDING_HOST: https://api.openai.com/v1
      EMBEDDING_MODEL: text-embedding-3-large
      EMBEDDING_DIM: "3072"
      EMBEDDING_BINDING_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./data/lightrag:/data/lightrag
      - ./secrets/lightrag_api_key.txt:/run/secrets/lightrag_api_key:ro
    ports:
      - "127.0.0.1:9621:9621"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9621/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
